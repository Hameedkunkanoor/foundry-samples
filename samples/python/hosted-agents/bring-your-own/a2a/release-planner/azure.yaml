# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: native-a2a-release-planner
requiredVersions:
  azd: '>=1.37.2'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.23'
services:
  ai-project:
    host: azure.ai.project
  scope:
    host: azure.ai.agent
    project: src/release-planner-a2a
    language: python
    kind: hosted
    name: release-scope
    uses: [ai-project]
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Assesses release scope using a model.
      version: 1.0.0
      skills:
        - id: scope
          name: Scope
          description: Assess deliverables, dependencies and acceptance criteria.
          tags: [release-planning]
    env:
      PYTHONNOUSERSITE: '1'
      AGENT_ROLE: scope
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
  risk:
    host: azure.ai.agent
    project: src/release-planner-a2a
    language: python
    kind: hosted
    name: release-risk
    uses: [ai-project]
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Reviews release risks using a model.
      version: 1.0.0
      skills:
        - id: risk
          name: Risk
          description: Review mitigations, verification and go/no-go conditions.
          tags: [release-planning]
    env:
      PYTHONNOUSERSITE: '1'
      AGENT_ROLE: risk
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
  coordinator:
    host: azure.ai.agent
    project: src/release-planner-a2a
    language: python
    kind: hosted
    name: release-coordinator
    uses: [ai-project]
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    protocols:
      - protocol: a2a
        version: 1.0.0
    agentEndpoint:
      protocols: [a2a, responses]
    agentCard:
      description: Delegates scope and risk work over native A2A before synthesizing a release plan.
      version: 1.0.0
      skills:
        - id: coordinator
          name: Release plan
          description: Combine two specialist assessments into an actionable plan.
          tags: [release-planning]
    env:
      PYTHONNOUSERSITE: '1'
      AGENT_ROLE: coordinator
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      SCOPE_AGENT_ENDPOINT: ${SCOPE_AGENT_ENDPOINT}
      RISK_AGENT_ENDPOINT: ${RISK_AGENT_ENDPOINT}
      OTEL_INSTRUMENTATION_A2A_SDK_ENABLED: 'false'
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: 'false'
    container:
      resources: {cpu: '0.5', memory: 1Gi}
infra:
  provider: microsoft.foundry
